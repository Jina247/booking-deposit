<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book with deposit</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --bg:#fafafa; --card:#fff; --text:#1c1c1e; --muted:#6b6b70; --accent:#7c3aed; --line:#e4e4e7; --ok:#15803d; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111113; --card:#1b1b1f; --text:#f2f2f3; --muted:#9a9aa2; --line:#2c2c32; } }
  body { margin:0; font:16px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:560px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:1.4rem; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 16px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tabs button { flex:1; } button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:10px 0 4px; }
  input, select, button { font:inherit; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); width:100%; box-sizing:border-box; }
  button { cursor:pointer; } button.primary { background:var(--accent); color:#fff; border-color:var(--accent); margin-top:12px; }
  .slots { display:flex; flex-wrap:wrap; gap:8px; } .slots button { width:auto; } .slots button.sel { background:var(--accent); color:#fff; }
  .pill { display:inline-block; padding:2px 10px; border-radius:99px; font-size:.8rem; border:1px solid var(--line); }
  .deposited,.completed { color:var(--ok); } .no_show,.expired { color:var(--bad); }
  #qr { display:flex; justify-content:center; margin:12px 0; } .hide { display:none; } .msg { color:var(--muted); font-size:.9rem; }
  .row { display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap; } .row button { width:auto; }
  a { color:var(--accent); word-break:break-all; }
</style>
</head>
<body>
<main>
  <h1>Book with a deposit</h1>
  <p class="sub">Pay a small USDC deposit on Solana to hold your slot.</p>
  <div class="tabs"><button id="tabC" class="on">Customer</button><button id="tabO">Shop owner</button></div>

  <section id="customer">
    <div class="card" id="form">
      <label>Service</label><select id="service"></select>
      <label>Day</label><input type="date" id="day">
      <label>Time</label><div class="slots" id="slots"><span class="msg">Pick a day</span></div>
      <label>Your name</label><input id="name" autocomplete="name">
      <label>Email</label><input id="email" type="email" autocomplete="email">
      <button class="primary" id="book">Book and pay deposit</button>
      <p class="msg" id="err"></p>
    </div>
    <div class="card hide" id="pay">
      <div class="row"><strong id="payTitle"></strong><span class="pill" id="payStatus"></span></div>
      <p class="msg" id="payInfo"></p>
      <div id="qr"></div>
      <a id="payLink" href="#">Open in wallet</a>
      <button id="simulate" class="hide">Simulate payment (demo mode)</button>
      <p class="msg">Waiting for the payment on the blockchain… this page checks every few seconds.</p>
      <button id="again" class="hide">Make another booking</button>
    </div>
  </section>

  <section id="owner" class="hide">
    <div class="card">
      <label>Owner key</label><input id="key" type="password" placeholder="OWNER_KEY">
      <button class="primary" id="load">Load bookings</button>
    </div>
    <div id="list"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let services = [], chosen = null, timer = null, mock = false, currentId = null;
const j = async (url, opt) => { const r = await fetch(url, opt); const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.detail || r.statusText); return d; };

$('tabC').onclick = () => { $('customer').classList.remove('hide'); $('owner').classList.add('hide'); $('tabC').classList.add('on'); $('tabO').classList.remove('on'); };
$('tabO').onclick = () => { $('owner').classList.remove('hide'); $('customer').classList.add('hide'); $('tabO').classList.add('on'); $('tabC').classList.remove('on'); };

async function init() {
  mock = (await j('/api/config').catch(() => ({}))).mock_payments === true;
  services = await j('/api/services');
  $('service').innerHTML = services.map(s => `<option value="${s.id}">${s.name} — $${s.price_cents/100} ($${s.deposit_cents/100} deposit)</option>`).join('');
  const t = new Date(Date.now() + 864e5); $('day').value = t.toISOString().slice(0, 10); $('day').min = $('day').value;
  loadSlots();
}
async function loadSlots() {
  chosen = null; $('slots').innerHTML = '<span class="msg">Loading…</span>';
  const slots = await j(`/api/slots?service_id=${$('service').value}&day=${$('day').value}`);
  $('slots').innerHTML = slots.length ? '' : '<span class="msg">No free times this day</span>';
  slots.forEach(s => { const b = document.createElement('button'); b.textContent = s.slice(11); b.onclick = () => { chosen = s; [...$('slots').children].forEach(c => c.classList.remove('sel')); b.classList.add('sel'); }; $('slots').appendChild(b); });
}
$('service').onchange = $('day').onchange = loadSlots;

$('book').onclick = async () => {
  $('err').textContent = '';
  if (!chosen || !$('name').value || !$('email').value) { $('err').textContent = 'Choose a time and fill in your name and email.'; return; }
  try {
    const b = await j('/api/bookings', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service_id: +$('service').value, start: chosen, customer_name: $('name').value, customer_email: $('email').value }) });
    showPay(b); poll(b.id);
  } catch (e) { $('err').textContent = e.message; loadSlots(); }
};
function showPay(b) {
  $('form').classList.add('hide'); $('pay').classList.remove('hide');
  currentId = b.id;
  $('simulate').classList.toggle('hide', !(mock && b.status === 'pending'));
  $('payTitle').textContent = `${b.service} · ${b.start.replace('T', ' ')}`;
  $('payStatus').textContent = b.status; $('payStatus').className = 'pill ' + b.status;
  if (b.status === 'pending') {
    $('payInfo').textContent = `Deposit: ${b.deposit_usdc} USDC. Balance on the day: ${b.balance_due_usdc} USDC.`;
    $('payLink').href = b.payment_url; $('payLink').classList.remove('hide');
    $('qr').innerHTML = ''; new QRCode($('qr'), { text: b.payment_url, width: 180, height: 180 });
  } else {
    $('qr').innerHTML = ''; $('payLink').classList.add('hide');
    $('payInfo').textContent = b.status === 'deposited' ? `Deposit received. See you then! Balance on the day: ${b.balance_due_usdc} USDC.` : `Status: ${b.status}`;
    $('again').classList.remove('hide');
  }
}
function poll(id) {
  clearInterval(timer);
  timer = setInterval(async () => {
    try { const b = await j(`/api/bookings/${id}/verify`, { method: 'POST' }); if (b.status !== 'pending') { clearInterval(timer); showPay(b); } }
    catch (e) { $('payInfo').textContent = e.message; if (/expired|already used/.test(e.message)) { clearInterval(timer); $('again').classList.remove('hide'); } }
  }, 4000);
}
$('simulate').onclick = async () => {
  try { const b = await j(`/api/dev/mock-pay/${currentId}`, { method: 'POST' }); clearInterval(timer); showPay(b); }
  catch (e) { $('payInfo').textContent = e.message; }
};
$('again').onclick = () => { $('pay').classList.add('hide'); $('form').classList.remove('hide'); $('again').classList.add('hide'); loadSlots(); };

async function loadOwner() {
  const h = { 'X-Owner-Key': $('key').value };
  try {
    const rows = await j('/api/owner/bookings', { headers: h });
    $('list').innerHTML = rows.length ? '' : '<p class="msg">No bookings yet.</p>';
    rows.forEach(b => {
      const d = document.createElement('div'); d.className = 'card';
      // Built with textContent so customer-entered names can't inject HTML/scripts into the owner page.
      const top = document.createElement('div'); top.className = 'row';
      const nm = document.createElement('strong'); nm.textContent = b.customer_name;
      const st = document.createElement('span'); st.className = 'pill ' + b.status; st.textContent = b.refund_needed ? 'paid late — refund' : b.status;
      top.append(nm, st);
      const info = document.createElement('div'); info.className = 'msg';
      info.textContent = `${b.service} · ${b.start.replace('T', ' ')} · deposit ${b.deposit_usdc} USDC`;
      d.append(top, info);
      if (b.status === 'deposited') {
        const r = document.createElement('div'); r.className = 'row';
        [['Showed up', 'complete'], ['No-show (keep deposit)', 'no-show']].forEach(([t, a]) => {
          const bt = document.createElement('button'); bt.textContent = t;
          bt.onclick = async () => { await j(`/api/owner/bookings/${b.id}/${a}`, { method: 'POST', headers: h }); loadOwner(); }; r.appendChild(bt); });
        d.appendChild(r);
      }
      $('list').appendChild(d);
    });
  } catch (e) { $('list').innerHTML = `<p class="msg">${e.message}</p>`; }
}
$('load').onclick = loadOwner;
init();
</script>
</body>
</html>
